name: check

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.14.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm pack --dry-run --ignore-scripts
